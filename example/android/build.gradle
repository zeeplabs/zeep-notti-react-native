buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Nuntis SDK (T18): the Google Services Gradle plugin the SDK's
        // Firebase Messaging dependency (android/build.gradle) requires.
        // Applied conditionally in app/build.gradle only when the
        // integrator has placed their own google-services.json - a fresh
        // clone/checkout has no real credentials committed.
        classpath("com.google.gms:google-services:4.4.4")
    }
}

apply plugin: "com.facebook.react.rootproject"

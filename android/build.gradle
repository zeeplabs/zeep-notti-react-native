buildscript {
  ext.Notti = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return Notti[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace "com.notti"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // Native Notti SDK (ANSDK-01): the whole engine, its manifest components and
  // `firebase-messaging` (as `api`, which the NottiBridge shim compiles against).
  // `api` so hosts can follow the shim's ReplaceWith (OQ-1); exact pin (OQ-2).
  api "br.com.zeeplabs:notti-android:0.2.0"

  testImplementation "junit:junit:4.13.2"
  // RemoteMessage and the RN maps are backed by Android framework classes,
  // unusable on the plain JVM; Robolectric provides real implementations.
  testImplementation "org.robolectric:robolectric:4.14.1"
}
